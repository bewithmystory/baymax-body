[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -I.
  -Iinclude
  -Ishared
build_src_filter =
  +<main.cpp>
  +<BodyRadio.cpp>
  +<DriveController.cpp>
  -<.pio/>
